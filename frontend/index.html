<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ask questions about our company and request a consultation.">
  <title>Company FAQ Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Relative paths work both through FastAPI and a simple local static server. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Company FAQ Assistant home">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span><strong>K8ight AI Chat Bot Assistant</strong><small>Answers from our knowledge base</small></span>
      </a>
      <button class="button button-secondary" id="openLeadForm" type="button">Talk to us</button>
    </header>

    <section class="chat" aria-label="Company FAQ chat">
      <div id="messages" class="messages" aria-live="polite">
        <div class="welcome-message">
          <h1>Hello, I am K8ight AI Chat Bot Assistant.</h1>
          <p>Ask me about K8ight services, team, portfolio, or technology.</p>
        </div>
      </div>
      <form id="chatForm" class="chat-form">
        <label class="sr-only" for="message">Your question</label>
        <textarea id="message" name="message" maxlength="2000" rows="1" placeholder="Ask a question…" required></textarea>
        <button class="button button-primary" id="sendButton" type="submit">Send</button>
      </form>
    </section>
  </main>

  <dialog id="leadDialog" aria-labelledby="leadTitle">
    <form id="leadForm" class="lead-form">
      <div class="dialog-header"><h2 id="leadTitle">Let’s talk</h2><button class="close" type="button" id="closeLeadForm" aria-label="Close">×</button></div>
      <p>Tell us a little about yourself and we’ll follow up.</p>
      <label>Name<input name="name" minlength="2" maxlength="120" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
      <label>Company <span>(optional)</span><input name="company" maxlength="160" autocomplete="organization"></label>
      <label>How can we help? <span>(optional)</span><textarea name="message" maxlength="2000" rows="4"></textarea></label>
      <p class="form-status" id="leadStatus" aria-live="polite"></p>
      <button class="button button-primary" id="leadSubmit" type="submit">Request a consultation</button>
    </form>
  </dialog>
  <script src="js/app.js" defer></script>
</body>
</html>
