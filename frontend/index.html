<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FAQ Assistant | K8ight Web Services</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/light.css" id="theme-style">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">
            <div class="logo">🤖</div>
            <div>
                <h2>AI Assistant</h2>
                <p>K8ight Web Services Knowledge Base</p>
            </div>
        </div>

        <!-- Model Selector Control (Provider hidden) -->
        <div class="controls">
            <div class="select-group">
                <label for="modelSelect"><i class="fa-solid fa-microchip"></i> Model</label>
                <select id="modelSelect" class="dropdown">
                    <option value="qwen2.5:3b">Loading Models...</option>
                </select>
            </div>

            <button id="themeToggle" title="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

    </header>


    <main id="chatBox" class="chat-box">

        <div class="welcome">

            <div class="welcome-logo">
                🤖
            </div>

            <h1>Welcome</h1>

            <p>
                Ask me anything about our company, services, team, portfolio, or technology stack.
            </p>

        </div>

    </main>


    <footer class="input-area">

        <textarea
            id="messageInput"
            rows="1"
            placeholder="Type your message..."></textarea>

        <button id="sendBtn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </footer>

</div>

<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
